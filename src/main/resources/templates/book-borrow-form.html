<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Borrow Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
	<div th:insert="comman/header :: header"></div>
	<div class="container my-5">
		<h3>Borrow Book</h3>
		<div th:if="${errorMessage}" class="alert alert-danger"
			th:text="${errorMessage}"></div>
		<div class="card">
			<div class="card-body">
				<div class="col-md-10">
					<p>
						<strong th:text="${book.name}"></strong> (ISBN: <span
							th:text="${book.isbn}"></span>) &ndash; available copies: <span
							th:text="${book.availableCopies} + ' / ' + ${book.totalCopies}"></span>
					</p>
					<p th:if="${book.availableCopies <= 0}" class="text-danger">No
						copies are currently available to borrow.</p>
					<form action="#" th:action="@{/books/{id}/borrow(id=${book.id})}"
						method="post">
						<div class="row">
							<div class="form-group col-md-8">
								<label for="borrowerName" class="col-form-label">Borrower
									Name</label> <input type="text" name="borrowerName"
									class="form-control" id="borrowerName"
									placeholder="Borrower Name" maxlength="100" required />
							</div>

							<div class="form-group col-md-8">
								<label for="dueDate" class="col-form-label">Due Date</label> <input
									type="date" name="dueDate" class="form-control" id="dueDate"
									th:value="${defaultDueDate}" th:min="${today}" required />
							</div>

							<div class="col-md-6">
								<input type="submit" class="btn btn-success" value=" Borrow ">
								<a href="/books" class="btn btn-secondary">Cancel</a>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div th:insert="comman/footer :: footer"></div>
</body>

</html>
