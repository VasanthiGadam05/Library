<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Open Loans</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

</head>
<body>
	<div th:insert="comman/header :: header"></div>
	<div class="container my-2">

		<div class="container my-5">
			<h3>Open Loans</h3>
			<div th:if="${successMessage}" class="alert alert-success"
				th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="alert alert-danger"
				th:text="${errorMessage}"></div>
			<div class="col-md-12">
				<h5 th:if="${#lists.isEmpty(loans)}">No open loans.</h5>
				<table class="table table-bordered"
					th:unless="${#lists.isEmpty(loans)}">
					<thead>
						<tr>
							<th>Book</th>
							<th>Borrower</th>
							<th>Issued</th>
							<th>Due</th>
							<th>Return</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="loan : ${loans}">
							<td th:text="${loan.book.name}"></td>
							<td th:text="${loan.borrowerName}"></td>
							<td th:text="${loan.issueDate}"></td>
							<td><span th:text="${loan.dueDate}"></span> <span
								th:if="${loan.dueDate.isBefore(today)}"
								class="badge badge-danger">Overdue</span></td>
							<td>
								<form th:action="@{/loans/{id}/return(id=${loan.id})}"
									method="post">
									<button type="submit" class="btn btn-success">
										<i class="fas fa-undo ml-2"></i> Return
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<div th:insert="comman/footer :: footer"></div>
</body>

</html>
